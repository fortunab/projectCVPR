[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cbmp-research"
version = "0.1.0"
description = "Source-only, center-balanced multi-prototype research pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "Pillow>=10", "matplotlib>=3.7"]

[project.optional-dependencies]
encoder = ["torch>=2.1", "torchvision>=0.16", "timm>=1.0"]
test = ["pytest>=7"]

[project.scripts]
cbmp = "cbmp.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

